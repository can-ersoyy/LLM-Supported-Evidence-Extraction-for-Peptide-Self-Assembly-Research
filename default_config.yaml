log_level: "INFO"
# Enable storing logs for each step in docs/logs/[step]/{run_identifier}.log
log_to_file: true
ncbi_batch_size: 100

# Run all pipeline steps in order (steps automatically pass outputs to downstream steps).
# You can also specify a subset of steps, e.g. [relevance, fetch_fulltext, extraction, evaluation].
steps: all

# Top-level input & defaults shared across steps (no per-step input wiring needed)
queries:
  - "peptide self-assembly"
db: "pmc"
provider: "google"
model_name: "gemini-3.5-flash-lite"
delay_seconds: 3
limit: 10

# Optional per-step overrides:
relevance:
  batch_size: 50

extraction:
  delay_seconds: 4