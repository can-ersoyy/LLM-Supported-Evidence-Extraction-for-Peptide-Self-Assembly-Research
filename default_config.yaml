log_level: "INFO"
# Enable storing logs for each step in docs/logs/[step]/{run_identifier}.log
log_to_file: true
ncbi_batch_size: 100

# List of steps to run in order (e.g. search, fetch, relevance, extraction, evaluation)
steps:
  - extraction

extraction:
  provider: "google"
  model_name: "gemini-3.5-flash-lite"
  delay_seconds: 4
  kwargs:
    limit: 3
    id: [130, 257, 941, 958, 1074]