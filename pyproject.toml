[project]
name = "peptide_extractor"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Can Ersoy", email = "can.ersoy@tum.de" }
]
requires-python = ">=3.10"
dependencies = [
    "alembic>=1.19.1",
    "azure-storage-blob>=12.30.3",
    "bs4>=0.0.2",
    "certifi==2026.7.22",
    "charset-normalizer==3.5.0",
    "click>=8.5.0",
    "en-core-sci-sm",
    "idna==3.18",
    "langchain-community>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-google-genai>=2.0.0",
    "langchain-ollama>=0.2.0",
    "langchain-openrouter>=0.2.8",
    "lxml>=6.1.3",
    "openpyxl>=3.1.5",
    "pandas>=2.3.3",
    "pydantic>=2.0",
    "python-dotenv==1.2.2",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.5",
    "requests==2.34.2",
    "seaborn>=0.13.2",
    "spacy>=3.8.16",
    "sqlmodel>=0.0.39",
    "urllib3==2.7.0",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "matplotlib>=3.10.9",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.uv]
override-dependencies = [
    "spacy>=3.8.16"
]

[tool.uv.sources]
en-core-sci-sm = { url = "https://s3-us-west-2.amazonaws.com/ai2-s2-scispacy/releases/v0.5.4/en_core_sci_sm-0.5.4.tar.gz" }
